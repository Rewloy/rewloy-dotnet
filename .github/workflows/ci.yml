# Every push and pull request: build and test on Linux and Windows, against
# both builds of the library (net8.0 and the netstandard2.0 one that .NET
# Framework programs use), then pack. The tests need no network: the API is a
# stub HttpMessageHandler. Warnings are errors here (CI=true).
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: 1
  DOTNET_CLI_TELEMETRY_OPTOUT: 1

jobs:
  test:
    name: ${{ matrix.os }}, ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # Which build of the library the tests load: net8.0 (the default) or netstandard2.0.
        asset: ['net8.0', 'netstandard2.0']
    steps:
      - uses: actions/checkout@v7
      # 10.0 builds and runs the tests; 8.0 is the second runtime the tests run on.
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Test
        shell: bash
        run: |
          if [ "${{ matrix.asset }}" = "netstandard2.0" ]; then asset="-p:RewloyAsset=netstandard2.0"; else asset=""; fi
          dotnet test Rewloy.sln -c Release $asset

  pack:
    name: pack
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      # Builds the package and lists what is in it. Nothing is published.
      - run: dotnet pack src/Rewloy -c Release -o artifacts
      - run: unzip -l artifacts/Rewloy.0.2.1.nupkg
